_format_version: "2.1"
services:
  - name: auth
    url: http://factory-supabase-auth:9999/
    routes:
      - name: auth
        strip_path: true
        paths: ["/auth/v1/"]
  - name: rest
    url: http://factory-supabase-rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths: ["/rest/v1/"]
  - name: storage
    url: http://factory-supabase-storage:5000/
    routes:
      - name: storage
        strip_path: true
        paths: ["/storage/v1/"]
plugins:
  - name: cors
